<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voucher Kas Keluar</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">
<main class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6 space-y-5">
  <h1 class="text-xl font-bold">Voucher Entri Transaksi Kas Keluar</h1>

  <section class="grid md:grid-cols-3 gap-3">
    <label class="text-sm">Tanggal<input id="trxDate" type="date" class="mt-1 w-full border rounded p-2"></label>
    <label class="text-sm">No. Bukti<input id="refNo" placeholder="KK-2026-001" class="mt-1 w-full border rounded p-2"></label>
    <label class="text-sm">Aktivitas Arus Kas
      <select id="activity" class="mt-1 w-full border rounded p-2">
        <option value="OPERASI">Operasi</option><option value="INVESTASI">Investasi</option><option value="PENDANAAN">Pendanaan</option>
      </select></label>
    <label class="text-sm md:col-span-3">Keterangan<input id="desc" class="mt-1 w-full border rounded p-2"></label>
  </section>

  <table class="w-full text-sm">
    <thead><tr class="text-left border-b"><th class="py-1">Akun</th><th class="w-40 text-right">Debit</th><th class="w-40 text-right">Kredit</th><th class="w-10"></th></tr></thead>
    <tbody id="lines"></tbody>
  </table>
  <button id="addLine" type="button" class="text-sm text-blue-600 hover:underline">+ Tambah baris</button>

  <section class="flex flex-wrap items-center justify-between gap-3 border-t pt-4">
    <div class="text-sm space-y-1">
      <div>Total Debit: <b id="totD">0</b> &nbsp; Total Kredit: <b id="totC">0</b></div>
      <div>Selisih: <b id="diff">0</b></div>
    </div>
    <span id="badge" class="px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-700">TIDAK SEIMBANG</span>
    <button id="submitBtn" disabled class="px-5 py-2 rounded bg-blue-600 text-white disabled:bg-slate-300 disabled:cursor-not-allowed">Submit</button>
  </section>
  <p id="msg" class="text-sm"></p>
  <p class="text-xs text-slate-500">Jurnal berstatus POSTED tidak dapat diedit atau dihapus; koreksi hanya melalui jurnal pembalik (storno).</p>
</main>

<script>
// Daftar akun contoh (di produksi: ambil dari tabel chart_of_accounts via Supabase)
const ACCOUNTS = [
  {id:1, code:'1-1100', name:'Kas'}, {id:2, code:'1-1200', name:'Bank'},
  {id:4, code:'6-1100', name:'Beban Listrik'}, {id:5, code:'6-1200', name:'Beban Gaji'},
  {id:6, code:'2-1100', name:'Utang Usaha'},  {id:7, code:'1-2100', name:'Peralatan'}
];
const $ = id => document.getElementById(id);
const toCents = v => Math.round((parseFloat(v) || 0) * 100);       // hindari galat floating point
const fmt = c => (c / 100).toLocaleString('id-ID', {minimumFractionDigits: 2});

function addLine(acc = '', d = '', c = '') {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="py-1 pr-2"><select class="acc w-full border rounded p-2"><option value="">-- pilih akun --</option>
      ${ACCOUNTS.map(a => `<option value="${a.id}" ${a.id == acc ? 'selected' : ''}>${a.code} ${a.name}</option>`).join('')}</select></td>
    <td class="pr-2"><input type="number" min="0" step="0.01" value="${d}" class="deb w-full border rounded p-2 text-right"></td>
    <td class="pr-2"><input type="number" min="0" step="0.01" value="${c}" class="cre w-full border rounded p-2 text-right"></td>
    <td><button type="button" class="del text-red-500">✕</button></td>`;
  $('lines').appendChild(tr);
  recalc();
}

function readLines() {
  return [...document.querySelectorAll('#lines tr')].map(tr => ({
    account_id: tr.querySelector('.acc').value ? Number(tr.querySelector('.acc').value) : null,
    debit: toCents(tr.querySelector('.deb').value),
    credit: toCents(tr.querySelector('.cre').value)
  }));
}

function recalc() {
  const L = readLines();
  const D = L.reduce((s, l) => s + l.debit, 0), C = L.reduce((s, l) => s + l.credit, 0);
  const validLines = L.length >= 2 && L.every(l => l.account_id && (l.debit > 0) !== (l.credit > 0)); // tepat satu sisi > 0
  const balanced = D === C && D > 0;
  const hasCashCredit = L.some(l => [1, 2].includes(l.account_id) && l.credit > 0);                 // kas keluar => Kredit Kas/Bank
  const ok = balanced && validLines && hasCashCredit && $('refNo').value.trim() && $('trxDate').value;
  $('totD').textContent = fmt(D); $('totC').textContent = fmt(C); $('diff').textContent = fmt(Math.abs(D - C));
  $('badge').textContent = balanced ? 'SEIMBANG ✓' : 'TIDAK SEIMBANG';
  $('badge').className = 'px-3 py-1 rounded-full text-sm font-semibold ' + (balanced ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700');
  $('submitBtn').disabled = !ok;
  $('msg').textContent = (balanced && !hasCashCredit) ? 'Kas keluar harus mengkredit akun Kas/Bank.' : '';
}

document.addEventListener('input', recalc);
$('addLine').onclick = () => addLine();
$('lines').addEventListener('click', e => { if (e.target.classList.contains('del')) { e.target.closest('tr').remove(); recalc(); } });

$('submitBtn').onclick = async () => {
  const payload = { p_trx_date: $('trxDate').value, p_reference_no: $('refNo').value.trim(),
    p_description: $('desc').value + ' [' + $('activity').value + ']',
    p_lines: readLines().map(l => ({account_id: l.account_id, debit: l.debit / 100, credit: l.credit / 100})) };
  const ringkas = payload.p_lines.map(l => `${ACCOUNTS.find(a => a.id === l.account_id).name}: D ${l.debit} / K ${l.credit}`).join('\n');
  if (!confirm(`Posting ${payload.p_reference_no}?\n\n${ringkas}\n\nSetelah POSTED tidak dapat diubah (hanya bisa distorno).`)) return;
  // Supabase: const { data, error } = await supabase.rpc('rpc_create_and_post_journal', payload);
  console.log('Dikirim ke RPC:', payload);
  $('msg').textContent = 'Terkirim ke server (simulasi). Validasi final tetap dilakukan oleh database.';
};

$('trxDate').valueAsDate = new Date();
addLine(4, '', ''); addLine(1, '', '');
</script>
</body>
</html>
